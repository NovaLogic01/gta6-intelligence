name: GTA VI Intelligence Ingestion

on:
  schedule:
    # Run every 6 hours, offset to avoid top-of-hour GitHub Actions congestion
    - cron: '17 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history to check for changes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run intelligence ingestion
        run: npm run intelligence:fetch

      - name: Validate dataset
        run: npm run intelligence:validate

      - name: Commit and Push changes
        run: |
          git config --global user.name "GTA VI Intelligence Engine"
          git config --global user.email "actions@github.com"
          
          # Only commit if data files actually changed
          if git diff --exit-code src/data/; then
            echo "No intelligence updates found."
          else
            git add src/data/
            git commit -m "chore(intelligence): update GTA VI intelligence feed"
            git push
            echo "Intelligence data updated and pushed successfully."
          fi
